  <body>
    <div id="root"></div>
    <noscript>
      <h1>BIXI Pulse — stations BIXI en temps réel à Montréal</h1>
      <p>
        BIXI Pulse affiche la disponibilité des vélos et des bornes de chaque station BIXI de
        Montréal sur une carte interactive, avec recherche et favoris. Les données proviennent du
        flux public GBFS de BIXI Montréal et sont rafraîchies toutes les 10 secondes.
      </p>
      <p>Cette application nécessite JavaScript pour fonctionner.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
